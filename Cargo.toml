[package]
name = "simplefin-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "simplefin"
path = "src/lib.rs"

[[bin]]
name = "simplefin"
path = "src/main.rs"

[dependencies]
reqwest   = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
base64    = "0.22"
url       = "2"
thiserror = "2"
clap       = { version = "4", features = ["derive"] }
jiff       = "0.2"

[dev-dependencies]
expect-test = "1"
