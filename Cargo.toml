[package]
name = "simplefin"
version = "0.2.0"
edition = "2024"
description = "Rust client library and CLI for the SimpleFIN protocol — read-only access to financial account and transaction data"
license = "MIT"
repository = "https://github.com/cry/simplefin-rs"
homepage = "https://github.com/cry/simplefin-rs"
readme = "README.md"
keywords = ["simplefin", "finance", "banking", "transactions"]
categories = ["api-bindings", "finance"]

[lib]
name = "simplefin"
path = "src/lib.rs"

[[bin]]
name = "simplefin"
path = "src/main.rs"

[dependencies]
reqwest   = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
base64    = "0.22"
url       = "2"
thiserror = "2"
clap       = { version = "4", features = ["derive"] }
jiff       = "0.2"

[dev-dependencies]
expect-test = "1"
